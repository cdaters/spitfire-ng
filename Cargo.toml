[workspace]
members = [
    "crates/sf-bbs",
    "crates/sf-core",
    "crates/sf-legacy",
    "crates/sf-monitor",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cdaters/spitfire-ng"

[workspace.dependencies]
argon2 = { version = "0.5.3", features = ["std"] }
chrono = "0.4.45"
chrono-tz = "0.10.4"
ctrlc = "3.5.2"
fluent-bundle = "0.16.0"
fluent-syntax = "0.12.0"
rand = "0.10.2"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
rpassword = "7.5.4"
russh = { version = "0.63.1", default-features = false, features = ["ring"] }
rusqlite = { version = "0.40.2", features = ["backup", "bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
serialport = { version = "4.9.0", default-features = false }
sha2 = "0.10.9"
tempfile = "3.27.0"
terminal_size = "0.4.4"
thiserror = "2.0.20"
toml = "1.1.4"
tokio = { version = "1.47.1", features = ["io-util", "net", "rt-multi-thread", "sync", "time"] }
crossterm = "0.29.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
unic-langid = "0.9.6"
zmodem2 = "0.7.2"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
